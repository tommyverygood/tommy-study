<!doctype html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tommy 的学习站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&family=Source+Serif+4:ital,opsz,wght@0,8..60,700;1,8..60,400&display=swap">
<style>
:root{--bg:#F2F4F6;--surface:#FFFFFF;--ink:#17202A;--ink-2:#394654;--muted:#637083;--line:#D3DAE1;--accent:#1B6784;--accent-soft:#DBEBF1;
  --font-body:"IBM Plex Sans","Noto Sans SC","PingFang SC",system-ui,sans-serif;--font-display:"Source Serif 4","Noto Serif SC","Songti SC",Georgia,serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0F141A;--surface:#161D25;--ink:#E3E8ED;--ink-2:#C0C9D2;--muted:#8B98A6;--line:#2A3542;--accent:#62B4D3;--accent-soft:#15313D}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.7}
.app{max-width:960px;margin:0 auto;padding-inline:20px;padding-block:56px 72px}
header{display:grid;gap:8px;margin-bottom:36px}
.kicker{font-family:var(--font-mono);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-family:var(--font-display);font-size:clamp(2rem,1.4rem + 2.4vw,2.8rem);line-height:1.15;text-wrap:balance}
header p{margin:0;color:var(--ink-2);max-width:40rem}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:18px}
.course{display:grid;gap:10px;align-content:start;padding:22px 22px 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.course:hover{border-color:var(--accent);transform:translateY(-2px)}
.course .code{font-family:var(--font-mono);font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.course .name{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1.25}
.course .name em{display:block;font-style:italic;font-weight:400;font-size:1rem;color:var(--muted)}
.course .blurb{font-size:.95rem;color:var(--ink-2)}
.course .blurb.en{font-size:.86rem;color:var(--muted)}
.facts{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.facts li{font-size:.76rem;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.go{margin-top:4px;font-weight:600;color:var(--accent)}
footer{margin-top:40px;font-size:.84rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.course{transition:none}.course:hover{transform:none}}
</style>
</head>
<body>
<style>
.hubgate{--g-bg:#F2F4F6;--g-card:#FFFFFF;--g-ink:#17202A;--g-ink2:#394654;--g-muted:#637083;--g-line:#BCC6D0;--g-acc:#1B6784;--g-acc-ink:#FFFFFF;--g-bad:#B23A36;
  min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-inline:16px;background:var(--g-bg);color:var(--g-ink);
  font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC",system-ui,sans-serif}
@media (prefers-color-scheme:dark){.hubgate{color-scheme:dark;--g-bg:#0F141A;--g-card:#161D25;--g-ink:#E3E8ED;--g-ink2:#C0C9D2;--g-muted:#8B98A6;--g-line:#394654;--g-acc:#62B4D3;--g-acc-ink:#0A1318;--g-bad:#EE7E71}}
body:has(.hubgate){margin:0;background:#F2F4F6}
@media (prefers-color-scheme:dark){body:has(.hubgate){background:#0F141A}}
.hubgate form{width:min(100%,380px);display:grid;gap:14px;padding:26px 24px;border:1px solid var(--g-line);border-radius:10px;background:var(--g-card)}
.hubgate .code{font:600 .74rem/1.4 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;color:var(--g-muted);text-transform:uppercase}
.hubgate h1{margin:0;font:700 1.55rem/1.25 "Source Serif 4","Noto Serif SC",Georgia,serif}
.hubgate p{margin:0;color:var(--g-ink2);font-size:.92rem;line-height:1.6}
.hubgate input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--g-line);border-radius:6px;background:var(--g-bg);color:var(--g-ink);font:inherit;font-size:1rem}
.hubgate label{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--g-ink2)}
.hubgate button{padding:10px 14px;border:0;border-radius:6px;background:var(--g-acc);color:var(--g-acc-ink);font:inherit;font-weight:600;cursor:pointer}
.hubgate button[disabled]{opacity:.6;cursor:wait}
.hubgate .msg{min-height:1.4em;font-size:.86rem;color:var(--g-bad)}
</style>
