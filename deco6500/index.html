<!doctype html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<style>.hub-back{display:inline-block;margin:0 0 10px;font:600 12px/1.6 system-ui,sans-serif;letter-spacing:.02em;color:inherit;opacity:.72;text-decoration:none}.hub-back:hover{opacity:1;text-decoration:underline}</style>
</head>
<body>
<title>DECO6500 学习站</title>
<meta name="description" content="UQ DECO6500 Advanced HCI 2026：A3 Layered Systemic Evaluation 阶段的中文学习网站。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* ==========================================================================
   INFS4203 学习站 — shell styles
   Tokens first (light on bare :root, dark twice), then layout, then content
   components that chapter fragments use (see AUTHORING.md).
   ========================================================================== */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --surface-3:#DDE3E9;
  --ink:#17202A; --ink-2:#394654; --muted:#637083; --line:#D3DAE1; --line-2:#BCC6D0;
  --accent:#1B6784; --accent-2:#134E65; --accent-ink:#FFFFFF; --accent-soft:#DBEBF1;
  --mark:#B87A0C; --mark-soft:#F7ECD4;
  --good:#2C7A4B; --good-soft:#DFF0E5; --bad:#B23A36; --bad-soft:#F6DFDC;
  --warn:#9E5F0A; --warn-soft:#F6E7CF; --plum:#6D4E9B; --plum-soft:#ECE5F5;
  --c1:#1B6784; --c2:#CF5238; --c3:#D39B13; --c4:#4F8A34; --c5:#7A57AB; --c6:#8A96A3;
  --c1-soft:#D6E8EF; --c2-soft:#F7DDD6; --c3-soft:#F6EACB; --c4-soft:#E0EDD8; --c5-soft:#E9E1F3; --c6-soft:#E6EAEE;
  --code-bg:#F6F8FA; --code-ink:#1E2833;
  --hl-kw:#8B3FA8; --hl-str:#2F7A3B; --hl-num:#A35A00; --hl-com:#7A8694; --hl-fn:#1B5FA8; --hl-lit:#B23A36;
  --shadow:0 1px 2px rgba(20,32,44,.06),0 6px 24px rgba(20,32,44,.06);
  --font-body:"IBM Plex Sans","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-display:"Source Serif 4","Noto Serif SC","Songti SC",Georgia,serif;
  --font-mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sidebar-w:288px; --toc-w:228px; --read-w:46rem;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F141A; --surface:#161D25; --surface-2:#1D2630; --surface-3:#26313D;
    --ink:#E3E8ED; --ink-2:#C0C9D2; --muted:#8B98A6; --line:#2A3542; --line-2:#394654;
    --accent:#62B4D3; --accent-2:#8FCBE2; --accent-ink:#0A1318; --accent-soft:#15313D;
    --mark:#E6B24C; --mark-soft:#372C15;
    --good:#61C48C; --good-soft:#15301F; --bad:#EE7E71; --bad-soft:#3A1C1A;
    --warn:#E3A254; --warn-soft:#36281A; --plum:#B39BE0; --plum-soft:#2A2238;
    --c1:#62B4D3; --c2:#EF7C63; --c3:#EDC24E; --c4:#8DC46B; --c5:#B39BE0; --c6:#7E8B99;
    --c1-soft:#173744; --c2-soft:#3E2219; --c3-soft:#3A3015; --c4-soft:#223119; --c5-soft:#2C2440; --c6-soft:#252E38;
    --code-bg:#121920; --code-ink:#D8E0E8;
    --hl-kw:#D19CEB; --hl-str:#8FD19A; --hl-num:#F0B36A; --hl-com:#7D8A98; --hl-fn:#7FB8F0; --hl-lit:#F08A7E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141A; --surface:#161D25; --surface-2:#1D2630; --surface-3:#26313D;
  --ink:#E3E8ED; --ink-2:#C0C9D2; --muted:#8B98A6; --line:#2A3542; --line-2:#394654;
  --accent:#62B4D3; --accent-2:#8FCBE2; --accent-ink:#0A1318; --accent-soft:#15313D;
  --mark:#E6B24C; --mark-soft:#372C15;
  --good:#61C48C; --good-soft:#15301F; --bad:#EE7E71; --bad-soft:#3A1C1A;
  --warn:#E3A254; --warn-soft:#36281A; --plum:#B39BE0; --plum-soft:#2A2238;
  --c1:#62B4D3; --c2:#EF7C63; --c3:#EDC24E; --c4:#8DC46B; --c5:#B39BE0; --c6:#7E8B99;
  --c1-soft:#173744; --c2-soft:#3E2219; --c3-soft:#3A3015; --c4-soft:#223119; --c5-soft:#2C2440; --c6-soft:#252E38;
  --code-bg:#121920; --code-ink:#D8E0E8;
  --hl-kw:#D19CEB; --hl-str:#8FD19A; --hl-num:#F0B36A; --hl-com:#7D8A98; --hl-fn:#7FB8F0; --hl-lit:#F08A7E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16.5px;line-height:1.8;
  font-feature-settings:"kern";text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::selection{background:var(--accent-soft)}
button{font:inherit;color:inherit}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- app layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.brand{display:grid;gap:2px;padding:4px 6px 12px;border-bottom:1px solid var(--line)}
.brand-code{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.brand-name{font-family:var(--font-display);font-size:1.32rem;font-weight:700;line-height:1.3;color:var(--ink);text-decoration:none}
.brand-sub{font-size:.8rem;color:var(--muted);line-height:1.5}
.search{position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);
  color:var(--ink);font:inherit;font-size:.9rem}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none}
.search-results{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);max-height:60vh;overflow-y:auto;padding:4px}
.search-results a{display:grid;gap:0;padding:7px 10px;border-radius:4px;text-decoration:none;color:var(--ink);font-size:.88rem;line-height:1.45}
.search-results a small{color:var(--muted);font-size:.74rem}
.search-results a:hover,.search-results a.sel{background:var(--accent-soft)}
.search-results .none{padding:10px;color:var(--muted);font-size:.85rem}
.syllabus{display:grid;gap:14px}
.mod-label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 6px 4px;font-weight:600}
.nav-list{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.nav-link{display:grid;grid-template-columns:2.6rem 1fr auto;align-items:center;gap:6px;padding:6px 8px;border-radius:5px;text-decoration:none;
  color:var(--ink-2);font-size:.92rem;line-height:1.35}
.nav-link:hover{background:var(--surface-2);color:var(--ink)}
.nav-link.active{background:var(--accent-soft);color:var(--ink)}
.nav-link .wk{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.nav-link.active .wk{color:var(--accent)}
.nav-link .ttl{min-width:0}
.nav-link .ttl small{display:block;font-size:.72rem;color:var(--muted)}
.ring{width:18px;height:18px}
.ring circle{fill:none;stroke-width:3}
.ring .bgc{stroke:var(--surface-3)}
.ring .fgc{stroke:var(--good);transition:stroke-dashoffset .3s}
.side-foot{margin-top:auto;font-size:.76rem;color:var(--muted);line-height:1.6;padding:12px 6px 0;border-top:1px solid var(--line)}
.side-foot button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

.main{min-width:0}
.topbar{display:none}
.content{display:grid;grid-template-columns:minmax(0,1fr) var(--toc-w);gap:40px;max-width:calc(var(--read-w) + var(--toc-w) + 120px);
  margin:0 auto;padding-inline:40px;padding-block:36px 96px}
.toc{position:sticky;top:28px;align-self:start;max-height:calc(100vh - 56px);overflow-y:auto;font-size:.84rem;line-height:1.45;scrollbar-width:thin}
.toc-label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.toc a{display:flex;gap:6px;align-items:flex-start;padding:4px 8px;border-radius:4px;color:var(--muted);text-decoration:none}
.toc a:hover{color:var(--ink);background:var(--surface-2)}
.toc a.h3{padding-left:22px;font-size:.8rem}
.toc a.on{color:var(--accent);background:var(--accent-soft)}
.toc a .dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:.45em;border:1.5px solid var(--line-2)}
.toc a.done .dot{background:var(--good);border-color:var(--good)}
.toc a.h3 .dot{display:none}

@media (max-width:1180px){
  .content{grid-template-columns:minmax(0,1fr);max-width:calc(var(--read-w) + 80px)}
  .toc{display:none}
}
@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:50;inset:0 auto 0 0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .22s ease;
    padding-top:calc(env(safe-area-inset-top,0px) + 20px);box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,22,.42)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;
    padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar button{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer}
  .topbar button svg{width:18px;height:18px;stroke:var(--ink);fill:none}
  .topbar .tb-title{font-weight:600;font-size:.95rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .tb-wk{font-family:var(--font-mono);font-size:.74rem;color:var(--accent)}
  .content{padding-inline:16px;padding-block:20px 80px}
  body{font-size:16px}
}

/* ---------- chapter frame ---------- */
.chapter{min-width:0}
.ch-head{display:grid;gap:10px;padding-bottom:22px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.ch-kicker{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;font-size:.8rem;color:var(--muted)}
.ch-kicker .wk{font-family:var(--font-mono);font-weight:600;color:var(--accent);letter-spacing:.04em;font-size:.86rem}
.ch-title{font-family:var(--font-display);font-size:clamp(1.9rem,1.3rem + 2.2vw,2.6rem);line-height:1.2;margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.005em}
.ch-en{font-family:var(--font-display);font-style:italic;color:var(--muted);font-size:1.08rem;margin:-4px 0 0}
.ch-meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;line-height:1.5;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip b{font-weight:600;color:var(--ink)}
.ch-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line)}
.ch-foot a{display:grid;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--surface)}
.ch-foot a:hover{border-color:var(--accent)}
.ch-foot a small{color:var(--muted);font-size:.76rem}
.ch-foot .next{text-align:right;grid-column:2}
.quiz-score{margin-top:40px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.9rem}
.quiz-score .bar{flex:1 1 160px;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.quiz-score .bar i{display:block;height:100%;background:var(--good)}
.quiz-score button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:3px 10px;font-size:.8rem;cursor:pointer}

/* ---------- prose ---------- */
.prose{max-width:var(--read-w)}
.prose > *{margin-block:0}
.prose > * + *{margin-top:1em}
/* nested flow: no UA margins; blocks inside any container are spaced by the previous sibling */
.prose :where(p,ul,ol,dl,blockquote,figure,h4,h5){margin-block:0}
.prose :where(div,details,li,dd,td,th,blockquote):not(.widget-body, .widget-body *) >
  :where(* + :is(p,ul,ol,dl,blockquote,figure,pre,h4,h5,details,.note,.formula,.example,.table-wrap,.fig,.quiz,.two-col,.tut-q,.widget,.cheatsheet,.recap,.output)){margin-top:.7em}
.prose :where(.card,.note,.cs-card) > :where(h4,h5) + *{margin-top:.35em}
.prose h2{font-family:var(--font-display);font-size:1.62rem;line-height:1.3;margin-top:2.6em;padding-top:.2em;font-weight:700;text-wrap:balance;
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.prose h2 .h-text{flex:1 1 auto;min-width:0}
.prose h3{font-size:1.2rem;line-height:1.4;margin-top:2em;font-weight:650;text-wrap:balance}
.prose h4{font-size:1.02rem;margin-top:1.6em;font-weight:650;color:var(--ink-2)}
.prose h2 + *, .prose h3 + *, .prose h4 + *{margin-top:.7em}
.prose p, .prose li{text-wrap:pretty}
.prose ul, .prose ol{padding-left:1.4em}
.prose li + li{margin-top:.3em}
.prose li > ul, .prose li > ol{margin-top:.3em}
.prose strong, .prose b{font-weight:650}
.prose em{font-style:normal;background:linear-gradient(transparent 62%,var(--mark-soft) 62%)}
.prose hr{border:0;border-top:1px solid var(--line);margin-block:2.4em}
.prose blockquote{margin-inline:0;padding:2px 0 2px 16px;border-left:3px solid var(--line-2);color:var(--ink-2)}
.prose code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .38em;border-radius:4px;overflow-wrap:anywhere}
.prose kbd{font-family:var(--font-mono);font-size:.82em;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--surface)}
.done-btn{flex:none;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-body);font-size:.74rem;font-weight:500;line-height:1;
  padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;letter-spacing:0}
.done-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4}
.done-btn:hover{border-color:var(--good);color:var(--good)}
.done-btn[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}

.term{font-weight:650;color:var(--ink)}
.term .en, .en{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:.88em;margin-left:.2em}
.src{display:inline-block;font-family:var(--font-mono);font-size:.7rem;line-height:1.5;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);
  vertical-align:.12em;white-space:nowrap;margin-left:2px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.nowrap{white-space:nowrap}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.hl{background:var(--mark-soft);padding:0 .2em;border-radius:3px}
.c1{color:var(--c1)} .c2{color:var(--c2)} .c3{color:var(--c3)} .c4{color:var(--c4)} .c5{color:var(--c5)} .c6{color:var(--c6)}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.table-wrap table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.55;font-variant-numeric:tabular-nums}
.table-wrap caption{caption-side:top;text-align:left;padding:8px 12px;font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--line)}
.table-wrap th,.table-wrap td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.table-wrap thead th{background:var(--surface-2);font-weight:600;font-size:.84rem;white-space:nowrap}
.table-wrap tbody tr:last-child td,.table-wrap tbody tr:last-child th{border-bottom:0}
.table-wrap td.r,.table-wrap th.r{text-align:right}
.table-wrap td.c,.table-wrap th.c{text-align:center}
.table-wrap tr.hi td,.table-wrap td.hi{background:var(--mark-soft)}
.table-wrap.compact th,.table-wrap.compact td{padding:4px 9px}
.table-wrap.mono td{font-family:var(--font-mono);font-size:.84rem}

/* display math */
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding-block:4px}
.prose mjx-container:not([display="true"]){white-space:nowrap}
.formula{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 18px 12px}
.formula .f-name{font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--accent);margin:0}
.formula .legend{list-style:none;padding:8px 0 0;margin:6px 0 0;border-top:1px dashed var(--line);display:grid;gap:3px;font-size:.9rem;color:var(--ink-2)}
.formula .legend li + li{margin-top:0}

/* callouts */
.note{padding:12px 16px 13px;border-radius:var(--r);background:var(--surface-2);border:1px solid transparent}
.note > * + *{margin-top:.6em}
.note > :first-child{margin-top:0}
.note ul,.note ol{padding-left:1.3em;margin-bottom:0}
.note-title{font-weight:650;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin:0}
.note-title::before{font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:1px 8px;border-radius:999px;line-height:1.7;flex:none}
.note-key{background:var(--accent-soft)} .note-key .note-title::before{content:"核心";background:var(--accent);color:var(--accent-ink)}
.note-tip{background:var(--good-soft)} .note-tip .note-title::before{content:"直觉";background:var(--good);color:var(--surface)}
.note-warn{background:var(--bad-soft)} .note-warn .note-title::before{content:"易错";background:var(--bad);color:var(--surface)}
.note-exam{background:var(--mark-soft)} .note-exam .note-title::before{content:"考点";background:var(--mark);color:var(--surface)}
.note-course{background:var(--plum-soft)} .note-course .note-title::before{content:"本课约定";background:var(--plum);color:var(--surface)}
.note-info .note-title::before{content:"补充";background:var(--c6);color:var(--surface)}

/* objectives / recap */
.objectives,.recap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 18px}
.objectives > h4,.recap > h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.objectives ul,.recap ul,.objectives ol,.recap ol{margin:0;padding-left:1.3em}

/* worked example */
.example{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ex-title{margin:0;padding:9px 16px;background:var(--surface-2);font-weight:650;font-size:.95rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ex-title::before{content:"例题";font-family:var(--font-mono);font-size:.7rem;font-weight:700;color:var(--accent);letter-spacing:.08em}
.example > :not(.ex-title){margin-inline:16px}
.example > :not(.ex-title) + *{margin-top:.8em}
.example > .ex-title + *{margin-top:12px}
.example > :last-child{margin-bottom:14px}
.steps{list-style:none;padding:0!important;counter-reset:st;display:grid;gap:10px}
.steps > li{counter-increment:st;position:relative;padding-left:36px}
.steps > li + li{margin-top:0}
.steps > li::before{content:counter(st);position:absolute;left:0;top:.18em;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-mono);font-size:.74rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.ex-answer{padding:9px 14px;border-radius:5px;background:var(--good-soft);font-weight:500}
.ex-answer::before{content:"答案 ";font-weight:700;color:var(--good)}

/* reveal */
details.reveal{border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 14px}
details.reveal > summary{cursor:pointer;padding:9px 0;font-weight:600;color:var(--accent);list-style:none;display:flex;gap:8px;align-items:center}
details.reveal > summary::-webkit-details-marker{display:none}
details.reveal > summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none}
details.reveal[open] > summary::before{transform:rotate(45deg)}
details.reveal[open]{border-style:solid;padding-bottom:12px}
details.reveal > :not(summary) + *{margin-top:.8em}

/* tutorial question */
.tut-q{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 18px}
.tut-q > * + *{margin-top:.8em}
.tut-q > .q-label{margin:0;font-family:var(--font-mono);font-size:.76rem;font-weight:700;letter-spacing:.06em;color:var(--mark)}

/* figures & diagrams */
.fig{margin-inline:0;display:grid;gap:8px;justify-items:center}
.fig > svg,.fig > img,.fig > canvas{max-width:100%;height:auto}
.fig figcaption{font-size:.84rem;color:var(--muted);text-align:center;max-width:40rem}
.fig .scroll{overflow-x:auto;max-width:100%}
.fig svg text{fill:var(--ink);font-family:var(--font-body)}
.fig svg .mono,.widget svg .mono{font-family:var(--font-mono)}
svg .f-ink{fill:var(--ink)} svg .f-muted{fill:var(--muted)} svg .f-surface{fill:var(--surface)} svg .f-bg{fill:var(--bg)} svg .f-line{fill:var(--line)}
svg .f-accent{fill:var(--accent)} svg .f-accent-soft{fill:var(--accent-soft)} svg .f-mark{fill:var(--mark)} svg .f-mark-soft{fill:var(--mark-soft)}
svg .f-good{fill:var(--good)} svg .f-bad{fill:var(--bad)} svg .f-none{fill:none}
svg .f-c1{fill:var(--c1)} svg .f-c2{fill:var(--c2)} svg .f-c3{fill:var(--c3)} svg .f-c4{fill:var(--c4)} svg .f-c5{fill:var(--c5)} svg .f-c6{fill:var(--c6)}
svg .f-c1s{fill:var(--c1-soft)} svg .f-c2s{fill:var(--c2-soft)} svg .f-c3s{fill:var(--c3-soft)} svg .f-c4s{fill:var(--c4-soft)} svg .f-c5s{fill:var(--c5-soft)} svg .f-c6s{fill:var(--c6-soft)}
svg .s-ink{stroke:var(--ink)} svg .s-muted{stroke:var(--muted)} svg .s-line{stroke:var(--line-2)} svg .s-accent{stroke:var(--accent)} svg .s-mark{stroke:var(--mark)}
svg .s-good{stroke:var(--good)} svg .s-bad{stroke:var(--bad)} svg .s-surface{stroke:var(--surface)}
svg .s-c1{stroke:var(--c1)} svg .s-c2{stroke:var(--c2)} svg .s-c3{stroke:var(--c3)} svg .s-c4{stroke:var(--c4)} svg .s-c5{stroke:var(--c5)} svg .s-c6{stroke:var(--c6)}
svg .t-muted{fill:var(--muted)!important} svg .t-accent{fill:var(--accent)!important} svg .t-bad{fill:var(--bad)!important} svg .t-good{fill:var(--good)!important} svg .t-on{fill:var(--surface)!important}

/* two-column compare */
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:14px}
.two-col > *{margin:0!important}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 16px}
.card > * + *{margin-top:.6em}
.card > h4:first-child{margin-top:0}

/* code */
pre{margin:0;position:relative}
pre code{display:block;overflow-x:auto;padding:14px 16px;border-radius:var(--r);background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);
  font-family:var(--font-mono);font-size:.82rem;line-height:1.65;tab-size:4;white-space:pre}
.prose pre code{background:var(--code-bg);padding:14px 16px}
.copy-btn{position:absolute;top:8px;right:8px;font-size:.72rem;padding:2px 8px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;opacity:.85}
.copy-btn:hover{color:var(--ink);opacity:1}
.hljs-keyword,.hljs-built_in,.hljs-type{color:var(--hl-kw)} .hljs-string,.hljs-regexp{color:var(--hl-str)} .hljs-number{color:var(--hl-num)}
.hljs-comment,.hljs-meta{color:var(--hl-com);font-style:italic} .hljs-title,.hljs-title.function_{color:var(--hl-fn)} .hljs-literal,.hljs-params{color:var(--hl-lit)}
.hljs-attr,.hljs-variable{color:var(--ink-2)}
.output{font-family:var(--font-mono);font-size:.8rem;line-height:1.55;white-space:pre;overflow-x:auto;padding:10px 14px;border-radius:var(--r);
  background:var(--surface-2);color:var(--ink-2);border:1px dashed var(--line-2)}
.output::before{content:"输出";display:block;font-family:var(--font-body);font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}

/* quiz */
.quiz{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px}
.quiz > * + *{margin-top:.7em}
.q-stem{margin:0;font-weight:500}
.q-stem::before{content:attr(data-n);font-family:var(--font-mono);font-size:.74rem;font-weight:700;color:var(--accent);margin-right:8px;letter-spacing:.04em}
.q-options{list-style:none;padding:0!important;display:grid;gap:6px}
.q-options > li{margin:0!important}
.q-opt{display:grid;grid-template-columns:1.7rem 1fr;align-items:start;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:5px;border:1px solid var(--line);
  background:var(--bg);cursor:pointer;line-height:1.6}
.q-opt:hover:not([disabled]){border-color:var(--accent)}
.q-opt .k{font-family:var(--font-mono);font-size:.78rem;font-weight:700;color:var(--muted);padding-top:.12em}
.q-opt[disabled]{cursor:default}
.q-opt.right{border-color:var(--good);background:var(--good-soft)}
.q-opt.right .k{color:var(--good)}
.q-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q-opt.wrong .k{color:var(--bad)}
.q-feedback{font-weight:600;font-size:.9rem}
.q-feedback.ok{color:var(--good)} .q-feedback.no{color:var(--bad)}
.q-explain{padding:10px 14px;border-radius:5px;background:var(--surface-2);font-size:.94rem}
.q-explain > * + *{margin-top:.5em}
.q-num-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q-num-row input{width:10rem;padding:6px 10px;border:1px solid var(--line-2);border-radius:5px;background:var(--bg);color:var(--ink);font-family:var(--font-mono)}
.q-actions{display:flex;gap:8px;flex-wrap:wrap}
.q-btn,.w-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;
  font-size:.86rem;line-height:1.3;color:var(--ink)}
.q-btn:hover,.w-btn:hover{border-color:var(--accent);color:var(--accent)}
.q-btn.primary,.w-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q-btn.primary:hover,.w-btn.primary:hover{background:var(--accent-2);color:var(--accent-ink)}
.w-btn[disabled]{opacity:.5;cursor:not-allowed}
.quiz-set{display:grid;gap:14px}
.quiz-set > *{margin:0!important}

/* widgets */
.widget{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);overflow:hidden}
.widget-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:650;font-size:.94rem}
.widget-head::before{content:"交互";font-family:var(--font-mono);font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--mark)}
.widget-body{padding:14px 16px 16px;display:grid;gap:12px;font-size:.92rem;line-height:1.6}
.widget-body > *{margin:0}
.widget-err{color:var(--bad);font-size:.86rem}
.w-controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.w-controls label{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;color:var(--ink-2)}
.w-controls input[type=range]{accent-color:var(--accent);width:9rem;max-width:100%}
.w-controls input[type=number],.w-controls input[type=text],.w-controls select,.widget textarea{padding:4px 8px;border:1px solid var(--line-2);border-radius:5px;background:var(--bg);color:var(--ink);
  font:inherit;font-size:.86rem}
.w-controls input[type=number]{width:5.5rem;font-family:var(--font-mono)}
.widget textarea{width:100%;font-family:var(--font-mono);font-size:.8rem;line-height:1.5;min-height:6rem}
.w-readout{font-family:var(--font-mono);font-size:.82rem;font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 12px;
  white-space:pre-wrap;overflow-x:auto;color:var(--ink-2)}
.w-stage{position:relative;width:100%;max-width:100%}
.w-stage canvas,.w-stage svg{display:block;width:100%;height:auto;max-width:100%;border-radius:4px;background:var(--bg);border:1px solid var(--line);touch-action:none}
.w-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px}
.w-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.w-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.w-hint{font-size:.8rem;color:var(--muted)}
.w-status{font-size:.86rem;padding:6px 10px;border-radius:5px;background:var(--accent-soft);color:var(--ink)}
.widget .table-wrap table{font-size:.82rem}
.widget svg text{fill:var(--ink);font-family:var(--font-body)}

/* cheatsheet cards */
.cheatsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:12px}
.cheatsheet > *{margin:0!important}
.cs-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px;min-width:0}
.cs-card > h5{margin:0 0 4px;font-size:.82rem;color:var(--accent);font-weight:700;letter-spacing:.02em}
.cs-card > * + *{margin-top:.4em}
.cs-card p,.cs-card li{font-size:.88rem}
.cs-card ul{padding-left:1.2em;margin:0}

/* glossary */
.gl-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gl-tools input{flex:1 1 14rem;padding:7px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem}
.gl-list{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.gl-item{display:grid;grid-template-columns:minmax(10rem,15rem) 1fr;gap:4px 18px;padding:10px 16px;border-bottom:1px solid var(--line)}
.gl-item:last-child{border-bottom:0}
.gl-item dt{font-weight:650;line-height:1.45}
.gl-item dt small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.gl-item dd{margin:0;font-size:.92rem;line-height:1.65}
.gl-item dd a{font-size:.76rem;font-family:var(--font-mono);margin-left:6px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-family:var(--font-display);font-size:clamp(2rem,1.3rem + 2.6vw,2.9rem);line-height:1.15;margin:6px 0 12px;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink-2);max-width:34rem}
.hero .kicker{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero-cta a{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--r);text-decoration:none;font-weight:600;font-size:.92rem;border:1px solid var(--line-2);color:var(--ink);background:var(--surface)}
.hero-cta a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hero-cta a.primary:hover{background:var(--accent-2)}
.hero-viz{position:relative}
.hero-viz canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;max-width:100%;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.hero-viz .cap{position:absolute;left:10px;bottom:8px;font-family:var(--font-mono);font-size:.7rem;color:var(--muted);background:var(--surface);padding:1px 6px;border-radius:4px}

.path{list-style:none;padding:0!important;display:grid;gap:0;counter-reset:none}
.path > li{display:grid;grid-template-columns:3.2rem 1fr auto;gap:12px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--line);margin:0!important}

.stat-row{display:flex;flex-wrap:wrap;gap:10px}
